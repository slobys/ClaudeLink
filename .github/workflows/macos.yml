name: macOS native clients
on:
  push:
    branches: ['**']
    paths: ['src/**', 'scripts/**', 'design/**', '.github/workflows/macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build native app, verify bridge, supervisor and native views
        run: bash scripts/build-macos.sh '${{ matrix.arch }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ClaudeLink-macos-${{ matrix.arch }}
          path: |
            artifacts/ClaudeLink-*-macos-${{ matrix.arch }}.*
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ClaudeLink-macos-${{ matrix.arch }}-evidence
          path: |
            artifacts/macos-${{ matrix.arch }}/*-results.json
            artifacts/macos-${{ matrix.arch }}/ui/*.png
            artifacts/macos-${{ matrix.arch }}/ui/ui-results.json
          retention-days: 14
