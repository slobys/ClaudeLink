name: Windows build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch pinned SDK and official core
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Build self-contained installer
        shell: pwsh
        run: ./scripts/build.ps1 -SkipBootstrap
      - name: Run core, protocol, browser, WPF and installer checks
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Package corresponding source
        shell: pwsh
        run: ./scripts/package-source.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ClaudeLink-windows-x64
          path: |
            artifacts/ClaudeLink-Setup-*.exe
            artifacts/ClaudeLink-Portable-*.zip
            artifacts/ClaudeLink-Source-*.zip
            artifacts/*-results.json
            artifacts/validation-summary.json
          retention-days: 14
